name: JMethod
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  JMethod:
    type: application
    platform: iOS
    sources:
      - JMethod
      # Script d'automatisation partagé avec Android : source unique, non copiée.
      - path: ../../native/shared/PronoteAutomation.js
        buildPhase: resources
    info:
      path: JMethod/Info.plist
      properties:
        CFBundleDisplayName: J-Method
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: BrandLogo
          UIImageRespectsSafeAreaInsets: true
        # Thème clair assumé (couleurs du web et d'Android) : clavier, alertes, menus et sélecteurs restent clairs.
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [fr.jmethod.app.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_LANGUAGE: fr
    dependencies:
      - sdk: libz.tbd
  JMethodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JMethodTests
      # Vecteurs synthétiques partagés : référencés depuis native/shared, jamais copiés.
      - path: ../../native/shared/protocol-vectors.json
        buildPhase: resources
      - path: ../../native/shared/notebook-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/domain-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/streak-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/color-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/programme-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/constants.json
        buildPhase: resources
      - path: ../../native/shared/notebook-course-vectors.json
        buildPhase: resources
      # Documents synthétiques (dossier copié tel quel dans le bundle de test, sous « documents »).
      - path: ../../native/shared/documents
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JMethod
  JMethodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - JMethodUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JMethod
    dependencies:
      - target: JMethod
schemes:
  JMethod:
    build:
      targets:
        JMethod: all
        JMethodTests: [test]
    test:
      gatherCoverageData: false
      targets: [JMethodTests]
  # Tests de fumée et captures d'écran (aperçu Debug sur document fictif), séparés des tests unitaires.
  JMethodUITests:
    build:
      targets:
        JMethod: all
        JMethodUITests: [test]
    test:
      gatherCoverageData: false
      targets: [JMethodUITests]
