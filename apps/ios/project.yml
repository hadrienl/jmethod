name: JMethod
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  JMethod:
    type: application
    platform: iOS
    sources:
      - JMethod
      # Script d'automatisation partagé avec Android : source unique, non copiée.
      - path: ../../native/shared/PronoteAutomation.js
        buildPhase: resources
    info:
      path: JMethod/Info.plist
      properties:
        CFBundleDisplayName: J-Method
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.app
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_LANGUAGE: fr
    dependencies:
      - sdk: libz.tbd
  JMethodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JMethodTests
      # Vecteurs synthétiques partagés : référencés depuis native/shared, jamais copiés.
      - path: ../../native/shared/protocol-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/domain-vectors.json
        buildPhase: resources
      - path: ../../native/shared/domain/constants.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JMethod
schemes:
  JMethod:
    build:
      targets:
        JMethod: all
        JMethodTests: [test]
    test:
      gatherCoverageData: false
      targets: [JMethodTests]
