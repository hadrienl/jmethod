name: JMethodConnectionPOC
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  JMethodConnectionPOC:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../shared/PronoteAutomation.js
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: JMethod Connexion
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: fr.jmethod.connectionpoc
            CFBundleURLSchemes: [jmethodpoc]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.connectionpoc
    dependencies:
      - sdk: libz.tbd
  JMethodConnectionPOCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../shared/protocol-vectors.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jmethod.connectionpoc.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JMethodConnectionPOC
schemes:
  JMethodConnectionPOC:
    build:
      targets:
        JMethodConnectionPOC: all
        JMethodConnectionPOCTests: [test]
    test:
      targets: [JMethodConnectionPOCTests]
