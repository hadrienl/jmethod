# App ordinateur (apps/android/desktopApp) : tests JVM, installeurs non signés Windows (MSI) et
# macOS (DMG) en artefacts, et Release GitHub pour une étiquette desktop-vX.Y.Z.
name: Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "apps/android/**"
      - "native/shared/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "native/shared/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/android

jobs:
  test:
    name: Tests JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Logique, protocole Pronote (vecteurs de native/shared) et app ordinateur.
      - run: ./gradlew --console=plain --stacktrace :shared:desktopTest :desktopApp:test

  package:
    name: Installeur ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            task: packageMsi
            format: msi
          - name: macOS
            os: macos-latest
            task: packageDmg
            format: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          version=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then version="${GITHUB_REF#refs/tags/desktop-v}"; fi
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
      - run: ./gradlew --console=plain :desktopApp:${{ matrix.task }} -Pjmethod.desktopVersion="$DESKTOP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: J-Method-${{ matrix.format }}
          path: apps/android/desktopApp/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publier les installeurs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "J-Method ordinateur ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Installeurs non signés : MSI pour Windows, DMG pour macOS (Apple Silicon). Voir apps/android/README.md pour l’installation."
